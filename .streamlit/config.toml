[server]
fileWatcherType = "none"
headless = true
port = 8501
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 50

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false

[theme]
base = "dark"
primaryColor = "#2e7d32"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1E232B"
textColor = "#FAFAFA"
